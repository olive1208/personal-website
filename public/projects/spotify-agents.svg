<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, Arial, Helvetica, sans-serif" fill="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fff"/>

  <!-- Row 1 -->
  <rect x="20" y="20" width="190" height="100" fill="#fff" stroke="#111"/>
  <text x="115" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="19">1. Prepare</text>
  <text x="115" y="80" text-anchor="middle" font-size="13" fill="#555">Code</text>
  <text x="115" y="99" text-anchor="middle" font-size="13" fill="#555">sample 100,000 reviews</text>

  <rect x="265" y="20" width="190" height="100" fill="#efefef" stroke="#111"/>
  <text x="360" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="19">2. Classifier agent</text>
  <text x="360" y="80" text-anchor="middle" font-size="13" fill="#555">Claude Haiku</text>
  <text x="360" y="99" text-anchor="middle" font-size="13" fill="#555">labels each review</text>

  <rect x="510" y="20" width="190" height="100" fill="#efefef" stroke="#111"/>
  <text x="605" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="19">3. Auditor agent</text>
  <text x="605" y="80" text-anchor="middle" font-size="13" fill="#555">Claude Haiku</text>
  <text x="605" y="99" text-anchor="middle" font-size="13" fill="#555">relabels a sample blind</text>

  <line x1="210" y1="70" x2="263" y2="70" stroke="#111" marker-end="url(#a)"/>
  <line x1="455" y1="70" x2="508" y2="70" stroke="#111" marker-end="url(#a)"/>
  <line x1="605" y1="120" x2="605" y2="178" stroke="#111" marker-end="url(#a)"/>

  <!-- Row 2, right to left -->
  <rect x="510" y="180" width="190" height="100" fill="#fff" stroke="#111"/>
  <text x="605" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="19">4. Group and rank</text>
  <text x="605" y="240" text-anchor="middle" font-size="13" fill="#555">Code, plus a namer agent</text>
  <text x="605" y="259" text-anchor="middle" font-size="13" fill="#555">count x severity</text>

  <rect x="265" y="180" width="190" height="100" fill="#efefef" stroke="#111"/>
  <text x="360" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="19">5. Writer agent</text>
  <text x="360" y="240" text-anchor="middle" font-size="13" fill="#555">Claude Sonnet</text>
  <text x="360" y="259" text-anchor="middle" font-size="13" fill="#555">drafts the memo</text>

  <rect x="20" y="180" width="190" height="100" fill="#fff" stroke="#111"/>
  <text x="115" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="19">6. Dashboard</text>
  <text x="115" y="240" text-anchor="middle" font-size="13" fill="#555">Postgres and Next.js</text>
  <text x="115" y="259" text-anchor="middle" font-size="13" fill="#555">no model calls</text>

  <line x1="510" y1="230" x2="457" y2="230" stroke="#111" marker-end="url(#a)"/>
  <line x1="265" y1="230" x2="212" y2="230" stroke="#111" marker-end="url(#a)"/>

  <!-- Code checks band -->
  <line x1="20" y1="310" x2="700" y2="310" stroke="#111" stroke-dasharray="4 4"/>
  <text x="360" y="334" text-anchor="middle" font-size="13" fill="#333">Code checks every agent's output, retries once, logs failures and tracks spending.</text>

  <!-- Legend -->
  <rect x="200" y="352" width="16" height="16" fill="#efefef" stroke="#111"/>
  <text x="224" y="365" font-size="13" fill="#555">AI agent</text>
  <rect x="330" y="352" width="16" height="16" fill="#fff" stroke="#111"/>
  <text x="354" y="365" font-size="13" fill="#555">Code only</text>
</svg>
